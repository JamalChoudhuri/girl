<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG Gallery & File Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #111; --gray: #767676; --light: #f4f4f4; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #fff; color: var(--primary); }
        
        /* Navigation */
        nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; position: sticky; top: 0; background: #fff; z-index: 1000; }
        .logo { font-size: 24px; font-weight: 800; text-decoration: none; color: #000; }

        /* Content Grid */
        .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
        .masonry { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
        }

        /* Item Styling */
        .item { 
            background: var(--light); 
            border-radius: 12px; 
            overflow: hidden; 
            position: relative;
            transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #f0f0f0;
        }
        .item:hover { transform: translateY(-8px); box-shadow: 0 12px 24px rgba(0,0,0,0.15); }

        .preview-media { width: 100%; height: auto; display: block; object-fit: contain; background: #eee; }

        /* Icon Styles for Files */
        .icon-box { text-align: center; color: var(--gray); padding: 20px; }
        .icon-box i { font-size: 50px; margin-bottom: 10px; color: #444; }
        .icon-box p { font-size: 13px; font-weight: 700; letter-spacing: 1px; }

        /* Overlay & Download */
        .overlay { 
            position: absolute; bottom: 0; left: 0; right: 0; padding: 15px; 
            background: linear-gradient(transparent, rgba(0,0,0,0.8)); 
            display: flex; justify-content: space-between; align-items: center;
            opacity: 0; transition: 0.3s;
        }
        .item:hover .overlay { opacity: 1; }
        .download-btn { background: #fff; color: #000; padding: 7px 18px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: bold; border: none; cursor: pointer; }
        .download-btn:hover { background: #eee; }

        #loader { text-align: center; padding: 50px; color: var(--gray); font-size: 16px; font-weight: 500; }
    </style>
</head>
<body>

<nav>
    <a href="#" class="logo">FILE STORAGE</a>
    <div id="status" style="font-size: 14px; font-weight: 600; color: #007bff;">Loaded: 0</div>
</nav>

<div class="container">
    <div class="masonry" id="gallery"></div>
    <div id="loader">নিচে স্ক্রল করুন... <i class="fas fa-circle-notch fa-spin"></i></div>
</div>

<script>
    const gallery = document.getElementById('gallery');
    const loader = document.getElementById('loader');
    const status = document.getElementById('status');

    let currentIndex = 1;
    const batchSize = 20; 
    const totalFiles = 10000;

    // ফাইল ডিটেকশন লজিক
    function getFileInfo(num) {
        // এখানে আপনি স্পেসিফিক নম্বরগুলো সেট করবেন
        if (num === 3 || num === 15 || num === 25) { 
            return { ext: 'mp4', type: 'video' }; // ৩, ১৫, ২৫ নম্বর ফাইল ভিডিও
        } 
        else if (num === 7 || num === 50) {
            return { ext: 'zip', type: 'archive' }; // ৭, ৫০ নম্বর ফাইল জিপ
        }
        else if (num === 12) {
            return { ext: 'pptx', type: 'powerpoint' }; // ১২ নম্বর ফাইল পাওয়ারপয়েন্ট
        }
        else {
            // আপনার অনুরোধ অনুযায়ী ডিফল্ট হলো PNG
            return { ext: 'png', type: 'image' }; 
        }
    }

    function loadNextBatch() {
        if (currentIndex > totalFiles) {
            loader.innerHTML = "সব ফাইল লোড সম্পন্ন হয়েছে!";
            return;
        }

        const nextLimit = Math.min(currentIndex + batchSize, totalFiles + 1);

        for (let i = currentIndex; i < nextLimit; i++) {
            const file = getFileInfo(i);
            const fileName = `${i}.${file.ext}`;
            const item = document.createElement('div');
            item.className = 'item';

            let content = '';

            if (file.type === 'image') {
                content = `<img src="${fileName}" class="preview-media" loading="lazy" alt="File ${i}">`;
            } 
            else if (file.type === 'video') {
                content = `
                    <video class="preview-media" muted loop onmouseover="this.play()" onmouseout="this.pause()">
                        <source src="${fileName}" type="video/mp4">
                    </video>`;
            } 
            else if (file.type === 'archive') {
                content = `<div class="icon-box"><i class="fas fa-file-zipper"></i><p>ZIP FOLDER</p></div>`;
            } 
            else if (file.type === 'powerpoint') {
                content = `<div class="icon-box"><i class="fas fa-file-powerpoint" style="color:#D04423;"></i><p>PPTX SLIDE</p></div>`;
            }

            item.innerHTML = `
                ${content}
                <div class="overlay">
                    <span style="color:#fff; font-size:11px; font-weight:bold;">#${i} - ${file.ext.toUpperCase()}</span>
                    <a href="${fileName}" download class="download-btn">DOWNLOAD</a>
                </div>
            `;
            gallery.appendChild(item);
        }

        currentIndex = nextLimit;
        status.innerText = `Loaded Files: ${currentIndex - 1}`;
    }

    // অটো স্ক্রল লোডিং
    window.onscroll = function() {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 900) {
            loadNextBatch();
        }
    };

    // শুরুতে প্রথম ২০টি লোড হবে
    loadNextBatch();
</script>

</body>
</html>
