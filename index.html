<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium PNG Gallery | HD Resources</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text: #111111;
            --accent: #007AFF;
            --gray: #888888;
            --light-gray: #f0f0f2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* Header / Nav */
        nav {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            border-bottom: 1px solid var(--light-gray);
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            z-index: 1000;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -1px;
            text-decoration: none;
            color: var(--text);
            text-transform: uppercase;
        }

        .status-badge {
            background: var(--light-gray);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--gray);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 80px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: -2px;
        }

        .hero p {
            color: var(--gray);
            font-size: 18px;
        }

        /* Gallery Grid */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 20px 50px;
        }

        .masonry {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        /* Image Card */
        .item {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: var(--light-gray);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: zoom-in;
        }

        .item:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s ease;
        }

        .item:hover img {
            transform: scale(1.05);
        }

        /* Professional Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .item:hover .overlay {
            opacity: 1;
        }

        .info {
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-download {
            background: white;
            color: black;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: 0.2s;
        }

        .btn-download:hover {
            background: var(--accent);
            color: white;
        }

        /* Loader */
        .footer-loader {
            text-align: center;
            padding: 60px 0;
            font-size: 14px;
            color: var(--gray);
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 32px; }
            .masonry { grid-template-columns: repeat(auto-fill, minmax(100%, 1fr)); }
        }
    </style>
</head>
<body>

<nav>
    <a href="#" class="logo">PNG.PRO</a>
    <div class="status-badge" id="counter">Total: 0</div>
</nav>

<section class="hero">
    <h1>High-Resolution PNGs</h1>
    <p>Discover 10,000+ premium transparent resources for your next creative project. Free to use.</p>
</section>

<div class="container">
    <div class="masonry" id="gallery"></div>
    <div class="footer-loader" id="loader">
        <p>Scrolling for more...</p>
    </div>
</div>

<script>
    const gallery = document.getElementById('gallery');
    const counter = document.getElementById('counter');
    const loader = document.getElementById('loader');

    let currentIndex = 1;
    const batchSize = 24; 
    const maxFiles = 10000;

    function renderImages() {
        if (currentIndex > maxFiles) {
            loader.innerHTML = "<p>You've reached the end of our collection.</p>";
            return;
        }

        const nextBatch = Math.min(currentIndex + batchSize, maxFiles + 1);

        for (let i = currentIndex; i < nextBatch; i++) {
            const fileName = `${i}.png`;
            const card = document.createElement('div');
            card.className = 'item';
            
            card.innerHTML = `
                <img src="${fileName}" loading="lazy" alt="Resource ${i}">
                <div class="overlay">
                    <div class="info">Collection #${i}</div>
                    <a href="${fileName}" download class="btn-download">Get PNG</a>
                </div>
            `;
            gallery.appendChild(card);
        }

        currentIndex = nextBatch;
        counter.innerText = `RESOURCES: ${currentIndex - 1}`;
    }

    // Smooth Infinite Scroll
    window.addEventListener('scroll', () => {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 800) {
            renderImages();
        }
    });

    // Initial Load
    renderImages();
</script>

</body>
</html>
