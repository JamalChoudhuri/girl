<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG.PRO | High Resolution Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">PNG<span>PRO</span></a>
            <div class="nav-menu">
                <button id="btn-girl" class="active" onclick="filterBy('girl')">Girls</button>
                <button id="btn-sea" onclick="filterBy('sea')">Sea</button>
                <button id="btn-couple" onclick="filterBy('couple')">Couple</button>
            </div>
            <div class="status-badge" id="counter">Assets: 0</div>
        </div>
    </nav>

    <header class="hero">
        <h1 id="pageTitle">Premium Girls Collection</h1>
        <p>Your ultimate source for high-quality visual resources.</p>
    </header>

    <div class="container">
        <div class="masonry-grid" id="gallery"></div>
        <div id="loader" class="loader">
            <p>Loading more assets...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
